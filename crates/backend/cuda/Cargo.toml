[package]
name = "infer-backend-cuda"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
cuda = ["dep:cutile", "dep:cuda-core"]

[dependencies]
infer-core.workspace = true
infer-ir.workspace = true
infer-models.workspace = true
infer-spi.workspace = true
infer-compiler.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
cutile = { version = "=0.4.0", optional = true }
cuda-core = { version = "=0.4.0", optional = true }

[dev-dependencies]
clap.workspace = true
infer-workloads.workspace = true
infer-backend-host.workspace = true
infer-state.workspace = true

[[example]]
name = "cuda-kernels"
required-features = ["cuda"]

[[example]]
name = "cuda-baseline"
required-features = ["cuda"]

[[example]]
name = "cuda-model-smoke"
required-features = ["cuda"]
