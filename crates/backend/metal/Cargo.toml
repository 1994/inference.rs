[package]
name = "infer-backend-metal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Case bodies under `tests/` are mounted from their module, so `tests/unit` and
# `tests/support` must not be auto-discovered as integration targets.
autotests = false

[[test]]
name = "forward"
path = "tests/forward.rs"

[[test]]
name = "golden"
path = "tests/golden.rs"

[[test]]
name = "paging"
path = "tests/paging.rs"

[[test]]
name = "retention"
path = "tests/retention.rs"

[[test]]
name = "runtime"
path = "tests/runtime.rs"

[lints]
workspace = true

[dependencies]
infer-core.workspace = true
infer-ir.workspace = true
infer-spi.workspace = true
infer-models.workspace = true
infer-compiler.workspace = true
infer-model-recipes.workspace = true
infer-state.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
metal.workspace = true
objc.workspace = true

[dev-dependencies]
infer-kernel-api.workspace = true
infer-runtime.workspace = true
infer-workloads.workspace = true
infer-quality.workspace = true
