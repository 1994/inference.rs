[package]
name = "infer-cli"
build = "../../../build.rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Case bodies under `tests/` are mounted from their module, so `tests/unit` and
# `tests/support` must not be auto-discovered as integration targets.
autotests = false

[[test]]
name = "smoke"
path = "tests/smoke.rs"

[lints]
workspace = true

[features]
default = []
cuda = ["dep:infer-backend-cuda", "infer-backend-cuda/cuda"]
test-backends = ["infer-ir/test-backends", "dep:infer-backend-host", "dep:infer-backend-reference"]

[dependencies]
infer-backend-cuda = { workspace = true, optional = true }
infer-core.workspace = true
infer-compiler.workspace = true
infer-ir.workspace = true
infer-spi.workspace = true
infer-runtime.workspace = true
infer-backend-reference = { workspace = true, optional = true }
infer-backend-host = { workspace = true, optional = true }
infer-backend-metal.workspace = true
infer-quality.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
infer-models.workspace = true
infer-workloads.workspace = true
infer-kernel-api.workspace = true
infer-frontdoor.workspace = true
infer-agent.workspace = true
tokio.workspace = true
mimalloc.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[[bin]]
name = "infer"
path = "src/main.rs"
