[package]
name = "infer-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Case bodies under `tests/` are mounted from their module, so `tests/unit` and
# `tests/support` must not be auto-discovered as integration targets.
autotests = false

[lints]
workspace = true

[dependencies]
infer-core.workspace = true
infer-ir.workspace = true
infer-spi.workspace = true
infer-runtime.workspace = true
infer-kernel-api.workspace = true
infer-quality.workspace = true
infer-observe.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

# The agent's scenes run on the declared protocol double in the runtime's tests/support
# source, so they need no CPU inference executor and no IR test feature.
[dev-dependencies]
infer-model-recipes.workspace = true
