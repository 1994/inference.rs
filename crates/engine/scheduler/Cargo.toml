[package]
name = "infer-scheduler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Case bodies under `tests/` are mounted from their module, so `tests/unit` and
# `tests/support` must not be auto-discovered as integration targets.
autotests = false

[[test]]
name = "cost_admission"
path = "tests/cost_admission.rs"

[[test]]
name = "lifecycle"
path = "tests/lifecycle.rs"

[[test]]
name = "limits"
path = "tests/limits.rs"

[[test]]
name = "paging"
path = "tests/paging.rs"

[[test]]
name = "policy"
path = "tests/policy.rs"

[lints]
workspace = true

[dependencies]
ahash.workspace = true
infer-core.workspace = true
infer-ir.workspace = true
infer-spi.workspace = true
serde.workspace = true
serde_json.workspace = true
