[package]
name = "infer-ir"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Unit case bodies live under `tests/`, mounted from the module they test, so they must not
# be auto-discovered as their own integration targets.
autotests = false

# `tests/` holds both unit case bodies (mounted from their module) and platform integration
# tests, so the integration targets are named explicitly while `autotests` stays off.
[[test]]
name = "hardware"
path = "tests/hardware.rs"

[[test]]
name = "tokens"
path = "tests/tokens.rs"

[lints]
workspace = true

[features]
default = []
test-backends = []

[dependencies]
infer-core.workspace = true
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true
