# The cheap half of the quality gate, run when a change is only documentation: the tools checks
# validate every local link, the layout rules and the test inventory, none of which need a Rust
# toolchain or a macOS runner.
name: docs
on:
  push:
    paths:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: |
          python3 -m venv "$RUNNER_TEMP/quality-tools"
          "$RUNNER_TEMP/quality-tools/bin/pip" install uv==0.10.12
          echo "$RUNNER_TEMP/quality-tools/bin" >> "$GITHUB_PATH"
      - run: make check-tools
